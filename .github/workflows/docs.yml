name: Docs

# Builds the API reference from the TSDoc comments in src/ with TypeDoc
# (typedoc.json, Anza theme in docs/theme/) and deploys it to GitHub Pages
# (https://anzaui.github.io/ts/). TypeDoc treats warnings as errors, so an
# undocumented export or a broken {@link} fails the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build docs
        run: npm run docs

      # Load every page in headless Chrome under /ts/ before deploying: fails on
      # JS errors, failed requests, a stuck loader, a missing heading or a
      # sidebar link that doesn't load its page.
      - name: Browser check
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pp" puppeteer-core@24.43.1
          PUPPETEER_CORE="$RUNNER_TEMP/pp/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js" \
            node docs/check.mjs _site /ts

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
